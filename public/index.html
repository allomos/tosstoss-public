<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f07c6c">
  <title>投桃</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icon.svg" alt="" width="32" height="32">
      <div>
        <h1><span data-i18n="brand">投桃</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="bar-actions">
      <select id="langSelect" class="lang" aria-label="Language"></select>
    </div>
  </header>

  <main>
    <section class="me card">
      <span id="meIcon" class="dev-icon" aria-hidden="true"></span>
      <div class="me-text">
        <div class="me-label" data-i18n="me.label"></div>
        <div class="me-name"><span id="meName">…</span><button id="renameBtn" class="rename" type="button" data-i18n-label="rename">✎</button></div>
      </div>
      <span id="status" class="status connecting"></span>
      <div class="mode">
        <div class="seg" role="radiogroup" data-i18n-label="mode.label">
          <label><input type="radio" name="mode" value="lan"><span id="modeLan" data-i18n="mode.public"></span></label>
          <label class="net-only" hidden><input type="radio" name="mode" value="plaza"><span data-i18n="mode.plaza"></span></label>
          <label class="net-only" hidden><input type="radio" name="mode" value="room"><span data-i18n="mode.room"></span></label>
          <label><input type="radio" name="mode" value="offline"><span data-i18n="mode.offline"></span></label>
        </div>
        <p id="modeHint" class="hint left"></p>
        <!-- In a room (internet version only). -->
        <div id="netRoom" class="room-panel" hidden>
          <div class="room-line"><span data-i18n="room.label"></span> <b id="roomCode" class="room-code"></b></div>
          <div class="net-actions">
            <button id="copyRoom" class="btn ghost small" type="button" data-i18n="room.copy"></button>
            <button id="qrRoom" class="btn ghost small" type="button" data-i18n="room.qr"></button>
            <button id="joinRoom" class="btn ghost small" type="button" data-i18n="room.joinOther"></button>
            <button id="createRoom" class="btn ghost small" type="button" data-i18n="room.new"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2><span data-i18n="peers.title"></span> <span id="peerCount" class="count">0</span></h2>
        <button id="selectAll" class="link" type="button" hidden></button>
      </div>
      <ul id="peers" class="peers"></ul>
      <div id="peersEmpty" class="empty">
        <p data-i18n="peers.empty"></p>
        <p><span id="emptyHow"></span><br><b id="pageUrl"></b></p>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="send.title"></h2>
      <label id="drop" class="drop" tabindex="0">
        <input id="fileInput" type="file" multiple hidden>
        <span class="drop-icon" aria-hidden="true">⇪</span>
        <span class="drop-main"><span class="on-pointer" data-i18n="drop.pointer"></span><span class="on-touch" data-i18n="drop.touch"></span></span>
        <span class="drop-sub" data-i18n="drop.sub"></span>
      </label>
      <ul id="picked" class="files"></ul>
      <button id="sendBtn" class="btn primary wide" type="button" disabled></button>
      <p id="sendHint" class="hint" data-i18n="hint.initial"></p>
    </section>

    <section id="transfersCard" class="card" hidden>
      <div class="card-head">
        <h2 data-i18n="transfers.title"></h2>
        <button id="clearDone" class="link" type="button" data-i18n="clearDone"></button>
      </div>
      <ul id="transfers" class="files"></ul>
    </section>

    <p class="note" data-i18n="note"></p>
  </main>

  <div id="dragOverlay" class="overlay" hidden><div data-i18n="overlay"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="qrDialog" class="qr-dialog" aria-labelledby="qrTitle">
    <h2 id="qrTitle" data-i18n="room.qrTitle"></h2>
    <div id="qrBox" class="qr-box"></div>
    <p class="qr-code-line"><span data-i18n="room.label"></span> <b id="qrCode" class="room-code"></b></p>
    <p id="qrLink" class="qr-link"></p>
    <button id="qrClose" class="btn primary wide" type="button" data-i18n="close"></button>
  </dialog>

  <script src="vendor/qrcode.js"></script>
  <script src="i18n.js"></script>
  <script src="names.js"></script>
  <script src="direct.js"></script>
  <script src="transfer.js"></script>
  <script src="app.js"></script>
</body>
</html>
